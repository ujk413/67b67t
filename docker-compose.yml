services:
  postgres:
    image: postgres:16
    container_name: messenger67-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-messenger} -d $${POSTGRES_DB:-messenger}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  api:
    build:
      context: ./api
    container_name: messenger67-api
    working_dir: /app
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECURE: "auto"
      ORIGIN: ${ORIGIN:-https://67chat.ru}
      USE_S3: ${USE_S3:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-ru-1}
      SWIFT_ENDPOINT: ${SWIFT_ENDPOINT:-https://swift.twcstorage.ru}
      SWIFT_ACCESS_KEY: ${SWIFT_ACCESS_KEY:-}
      SWIFT_SECRET_KEY: ${SWIFT_SECRET_KEY:-}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:-}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
      SYSTEM_CHANNEL_TITLE: ${SYSTEM_CHANNEL_TITLE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_CREDENTIAL_TTL_SEC: ${TURN_CREDENTIAL_TTL_SEC:-3600}
      NODE_ENV: "production"
    volumes:
      # Uploaded media (voice, video notes, images, files) lives ONLY in this bind
      # mount (./data/uploads) unless USE_S3=true. Back it up together with the
      # database (scripts/backup_db.sh covers Postgres only) and never delete it.
      # Only persisted data is mounted — the application code ships in the image.
      # Previously ./api:/app shadowed the built image, forcing `npm install` on
      # every container start.
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    container_name: messenger67-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  turn:
    image: coturn/coturn:latest
    container_name: messenger67-turn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "10000-10100:10000-10100/udp"
    environment:
      - TURN_SECRET=${TURN_SECRET}
      - TURN_REALM=${TURN_REALM:-67chat.ru}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP}
      - TURN_RELAY_IP=${TURN_RELAY_IP:-172.18.0.2}
    # Time-limited credentials (TURN REST API): the API hands clients
    # username="<expiry-unix>:<userid>" and credential=base64(HMAC-SHA1(TURN_SECRET, username)).
    # No static shared user/password exists any more.
    command: >
      -n --log-file=stdout
      --min-port=10000 --max-port=10100
      --realm=${TURN_REALM:-67chat.ru}
      --fingerprint
      --listening-ip=0.0.0.0
      --relay-ip=${TURN_RELAY_IP:-172.18.0.2}
      --external-ip=${TURN_EXTERNAL_IP}/${TURN_RELAY_IP:-172.18.0.2}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --no-cli
      --no-multicast-peers
      --no-tcp-relay
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.0.0.0-192.0.0.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=198.18.0.0-198.19.255.255
      --denied-peer-ip=240.0.0.0-255.255.255.255
      --total-quota=100
      --user-quota=12
    volumes:
      - ./data/caddy/data:/etc/caddy/certificates:ro
    restart: unless-stopped

  tor:
    image: goldy/tor-hidden-service:latest
    container_name: messenger67-tor
    environment:
      MESSENGER67_TOR_SERVICE_HOSTS: "80:caddy:80,443:caddy:443"
      MESSENGER67_TOR_SERVICE_VERSION: "3"
    volumes:
      - ./data/tor:/var/lib/tor/hidden_service/
    depends_on:
      - caddy
    restart: unless-stopped
