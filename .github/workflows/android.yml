name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 and ships a different
    # Android SDK layout. 24.04 has the toolchain this project is tested on.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No android-actions/setup-android here: the runner image already ships the
      # Android SDK, and that action tries to install the retired `tools` package,
      # which fails. Gradle auto-provisions anything missing (licenses are
      # pre-accepted on GitHub runners).
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck and mobile regression tests
        working-directory: mobile
        run: |
          npm run typecheck
          npm test

      - name: Restore Firebase Android configuration when configured
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib
          value = os.environ.get('GOOGLE_SERVICES_JSON', '')
          if value:
              pathlib.Path('mobile/google-services.json').write_text(value)
          else:
              print('Firebase is not configured: push delivery is disabled in this APK')
          PYCODE

      # mobile/android is generated (see mobile/.gitignore) — the folder in the
      # repo holds only signing material, restored from secrets below.
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p mobile/android/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mobile/android/keystores/release.keystore
          cat > mobile/android/key.properties <<EOF
          storeFile=../keystores/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          sed -i 's/^ *//' mobile/android/key.properties
          echo "keystore restored, $(stat -c%s mobile/android/keystores/release.keystore) bytes"

      # Expo prebuild генерирует build.gradle, где release подписывается
      # ОТЛАДОЧНЫМ ключом. Без этого шага восстановленный keystore и
      # key.properties просто игнорируются, и APK уезжает как CN=Android Debug.
      - name: Включить релизную подпись в Gradle
        run: python3 scripts/ci_patch_signing.py

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew :67chat-room-key:testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          # Постоянное имя: ссылка на релиз не меняется от сборки к сборке.
          NAME="messenger67.apk"
          cp "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: messenger67-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # Stable download link for the phone: Releases → apk-latest
      - name: Убрать предыдущие APK из релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Имя APK постоянное, поэтому удаляем только то, что с ним не
          # совпадает (старые сборки с меткой времени). Актуальный файл не
          # трогаем: если снести его до загрузки нового, релиз на минуту
          # остаётся пустым и ссылка отдаёт 404.
          KEEP="messenger67.apk"
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' 2>/dev/null | while read -r name; do
              [ -n "$name" ] || continue
              [ "$name" = "$KEEP" ] && continue
              gh release delete-asset apk-latest "$name" \
                --repo "$GITHUB_REPOSITORY" --yes || true
            done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Messenger67 — latest APK"
          body: |
            Автосборка из ветки `main`.
            Коммит: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.path }}

      # Публикация на сервер: приложение само увидит новый versionCode и
      # предложит обновиться (Android всё равно спросит подтверждение).
      # Пропускается, если секреты для деплоя не заданы.
      - name: Publish APK to the update server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::warning::DEPLOY_SSH_KEY/DEPLOY_HOST not set: skipping in-app update publish"
            exit 0
          fi
          VERSION=$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['version'])")
          VERSION_CODE=$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['android']['versionCode'])")
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          TARGET="${DEPLOY_USER:-root}@${DEPLOY_HOST}"
          REMOTE_APK="/tmp/67chat-release-${VERSION_CODE}.apk"
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new "${{ steps.apk.outputs.path }}" "${TARGET}:${REMOTE_APK}"
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new scripts/publish_apk.sh "${TARGET}:/tmp/publish_apk.sh"
          $SSH "$TARGET" "chmod +x /tmp/publish_apk.sh && RELEASE_DIR=/opt/messenger67/data/releases VERSION='${VERSION}' VERSION_CODE='${VERSION_CODE}' /tmp/publish_apk.sh '${REMOTE_APK}' 'Автосборка из main' && rm -f '${REMOTE_APK}'"
          # Проверяем, что сервер действительно отдаёт новую версию.
          $SSH "$TARGET" "curl -fsS https://67chat.ru/api/app/version | head -c 300"
