name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 and ships a different
    # Android SDK layout. 24.04 has the toolchain this project is tested on.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No android-actions/setup-android here: the runner image already ships the
      # Android SDK, and that action tries to install the retired `tools` package,
      # which fails. Gradle auto-provisions anything missing (licenses are
      # pre-accepted on GitHub runners).
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # mobile/android is generated (see mobile/.gitignore) — the folder in the
      # repo holds only signing material, restored from secrets below.
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p mobile/android/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > mobile/android/keystores/release.keystore
          cat > mobile/android/key.properties <<EOF
          storeFile=../keystores/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          sed -i 's/^ *//' mobile/android/key.properties
          echo "keystore restored, $(stat -c%s mobile/android/keystores/release.keystore) bytes"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          # Постоянное имя: ссылка на релиз не меняется от сборки к сборке.
          NAME="messenger67.apk"
          cp "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: messenger67-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # Stable download link for the phone: Releases → apk-latest
      - name: Убрать предыдущие APK из релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Имена APK содержат метку времени, поэтому без этой чистки релиз
          # копит сборки. Оставляем только ту, что собирается сейчас.
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' 2>/dev/null | while read -r name; do
              [ -n "$name" ] || continue
              gh release delete-asset apk-latest "$name" \
                --repo "$GITHUB_REPOSITORY" --yes || true
            done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Messenger67 — latest APK"
          body: |
            Автосборка из ветки `main`.
            Коммит: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
